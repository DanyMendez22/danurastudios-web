<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danura Studios - Mobile Apps & Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Overlay para habilitar el sonido en la primera interacción */
        #audioOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #audioOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .play-card {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .play-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .play-card p {
            color: #a5b4fc;
            font-size: 1rem;
        }

        .hero {
            margin: auto;
            max-width: 600px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1.2s ease-in-out;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .mute-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        footer {
            padding: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }

        footer a {
            color: #a5b4fc;
            text-decoration: none;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Capa interactiva inicial -->
    <div id="audioOverlay" onclick="enableAudio()">
        <div class="play-card">
            <h2>✨ Danura Studios</h2>
            <p>Haz clic en cualquier parte para ingresar con música Pop 🎵</p>
        </div>
    </div>

    <div></div>

    <main class="hero">
        <span class="badge">Estudio Creativo</span>
        <h1>Danura Studios</h1>
        <p class="subtitle">Desarrollando experiencias interactivas y aplicaciones móviles de próxima generación.</p>

        <!-- Botón para mutear / desmutear -->
        <button class="mute-btn" onclick="toggleMute()">
            <span id="btnIcon">🔊</span> <span id="btnText">Silenciar Música</span>
        </button>
    </main>

    <!-- Pista Pop / Synth-Pop No Copyright en formato MP3 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=pop-dance-110826.mp3" type="audio/mpeg">
    </audio>

    <footer>
        <p>© 2026 Danura Studios. Todos los derechos reservados. | <a href="/privacy.html">Política de Privacidad</a></p>
    </footer>

    <script>
        const audio = document.getElementById('bgMusic');
        const overlay = document.getElementById('audioOverlay');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        audio.volume = 0.5; // Volumen al 50%

        function enableAudio() {
            audio.play().then(() => {
                overlay.classList.add('hidden');
            }).catch(err => {
                console.log("Error de audio: ", err);
                overlay.classList.add('hidden');
            });
        }

        function toggleMute() {
            if (audio.paused) {
                audio.play();
                btnText.textContent = "Silenciar Música";
                btnIcon.textContent = "🔊";
            } else {
                audio.pause();
                btnText.textContent = "Activar Música";
                btnIcon.textContent = "🔇";
            }
        }
    </script>
</body>
</html>
