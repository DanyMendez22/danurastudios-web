<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danura Studios - Mobile Apps & Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .hero {
            margin: auto;
            max-width: 600px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1.2s ease-in-out;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Botón de Silenciar / Mute flotante */
        .mute-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .mute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        footer {
            padding: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }

        footer a {
            color: #a5b4fc;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div></div>

    <main class="hero">
        <span class="badge">Estudio Creativo</span>
        <h1>Danura Studios</h1>
        <p class="subtitle">Desarrollando experiencias interactivas y aplicaciones móviles de próxima generación.</p>

        <!-- Botón de Silenciar / Activar Sonido -->
        <button class="mute-btn" id="muteBtn" onclick="toggleMute(event)">
            <span id="btnIcon">🔊</span> <span id="btnText">Silenciar Música</span>
        </button>
        
        <audio id="bgMusic" loop autoplay preload="auto">
            <source src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Lounge_Loop.ogg" type="audio/ogg">
        </audio>
    </main>

    <footer>
        <p>© 2026 Danura Studios. Todos los derechos reservados. | <a href="/privacy.html">Política de Privacidad</a></p>
    </footer>

    <script>
        const audio = document.getElementById('bgMusic');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        // Intento de reproducción directa
        function startAudio() {
            audio.play().then(() => {
                btnText.textContent = "Silenciar Música";
                btnIcon.textContent = "🔊";
            }).catch(() => {
                // Si el navegador bloquea el autoplay, se activa al primer clic o toque en cualquier parte
                btnText.textContent = "Activar Música";
                btnIcon.textContent = "🔇";
            });
        }

        // Iniciar audio al cargar o en la primera interacción
        window.addEventListener('DOMContentLoaded', startAudio);
        document.body.addEventListener('click', function initOnClick() {
            if (audio.paused) {
                audio.play();
                btnText.textContent = "Silenciar Música";
                btnIcon.textContent = "🔊";
            }
            document.body.removeEventListener('click', initOnClick);
        }, { once: true });

        function toggleMute(event) {
            event.stopPropagation(); // Evitar conflicto con el listener del body
            if (audio.paused) {
                audio.play();
                btnText.textContent = "Silenciar Música";
                btnIcon.textContent = "🔊";
            } else {
                audio.pause();
                btnText.textContent = "Activar Música";
                btnIcon.textContent = "🔇";
            }
        }
    </script>
</body>
</html>
