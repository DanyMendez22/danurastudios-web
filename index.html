<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danura Studios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #0b0719;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de partículas de fondo */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Destellos neón de fondo (Glow) */
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.6;
        }
        .glow-1 {
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #7c3aed 0%, #4c1d95 100%);
        }
        .glow-2 {
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: #a855f7;
        }

        /* Contenido Principal */
        main {
            position: relative;
            z-index: 10;
            margin: auto;
            padding: 40px 20px;
            max-width: 700px;
            animation: fadeIn 1.2s ease-out;
        }

        .logo-img {
            max-width: 280px;
            width: 100%;
            height: auto;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            color: #c084fc;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Pie de página con Privacidad */
        footer {
            position: relative;
            z-index: 10;
            padding: 24px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        footer a {
            color: #c084fc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Animaciones */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <canvas id="particles"></canvas>

    <main>
        <!-- Carga apuntando a logo.jpg -->
        <img src="logo.jpg" alt="Danura Studios Logo" class="logo-img">
        
        <h1>DANURA STUDIOS</h1>
        <p class="subtitle">Estudio de desarrollo de aplicaciones y juegos móviles.</p>
    </main>

    <footer>
        <p>© 2026 Danura Studios | <a href="/privacy.html">Política de Privacidad</a></p>
    </footer>

    <!-- Animación de partículas de fondo -->
    <script>
        const canvas = document.getElementById('particles');
