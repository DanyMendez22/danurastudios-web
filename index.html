<script>
        const translations = {
            es: {
                subtitle: "Estudio de desarrollo de aplicaciones y juegos móviles.",
                privacyText: "Política de Privacidad",
                privacyHref: "/privacy.html"  // Añadimos la barra diagonal al inicio para buscar desde la raíz exacta
            },
            en: {
                subtitle: "Mobile application and game development studio.",
                privacyText: "Privacy Policy",
                privacyHref: "/privacy-en.html" // Añadimos la barra diagonal al inicio
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            
            document.getElementById('subtitle').textContent = translations[lang].subtitle;
            const privacyLink = document.getElementById('privacyLink');
            privacyLink.textContent = translations[lang].privacyText;
            privacyLink.href = translations[lang].privacyHref;
            
            localStorage.setItem('danura_lang', lang);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('danura_lang') || 'es';
            document.getElementById('languageSelect').value = savedLang;
            
            const privacyLink = document.getElementById('privacyLink');
            document.getElementById('subtitle').textContent = translations[savedLang].subtitle;
            privacyLink.textContent = translations[savedLang].privacyText;
            privacyLink.href = translations[savedLang].privacyHref;
        });
    </script>
